[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-microscopy-image-analysis"
version = "0.1.0"
description = "A classical microscopy image analysis pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-image",
    "scipy",
    "tifffile"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]